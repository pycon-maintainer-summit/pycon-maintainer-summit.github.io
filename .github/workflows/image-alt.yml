name: Images must have alt text

# Builds the site and fails if any <img> in the output lacks a non-empty alt
# attribute, or any markdown image in src/content is written as ![](...).
# See scripts/check-image-alt.py.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm run build

      - name: Check built output and content sources
        run: |
          python3 scripts/check-image-alt.py dist src/content
          # &amp;amp; means a URL was HTML-escaped twice, which breaks
          # query-string links.
          if grep -rl --include='*.html' '&amp;amp;' dist; then
            echo "::error::double-escaped ampersand in built output"; exit 1
          fi
